name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"

      - name: Instalar Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sincronizar dependencias
        run: uv sync --extra dev

      - name: Lint con ruff
        run: uv run ruff check src tests

      - name: Tests con pytest
        run: uv run pytest -v --cov=src/ovandocode --cov-report=term-missing
