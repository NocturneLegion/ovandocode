[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovandocode"
version = "0.3.0"
description = "OVANDOCODE - Agente de codificacion autonomo con TUI, MCP, skills y multi-proveedor LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jorge Luis Ovando", email = "ovandocode@localhost" }]
keywords = ["ai", "agent", "coding", "tui", "mcp", "llm", "cli", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "textual>=0.83.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "keyring>=25.2.0",
    "python-dotenv>=1.0.1",
    "mcp>=1.0.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "aiofiles>=24.1.0",
    "tomli-w>=1.0.0",
    "platformdirs>=4.2.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
ovandocode = "ovandocode.cli:main"

[project.urls]
Homepage = "https://github.com/ovandocode/ovandocode"
Repository = "https://github.com/ovandocode/ovandocode"

[tool.hatch.build.targets.wheel]
packages = ["src/ovandocode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
exclude = [".venv", "build", "dist", "__pycache__", "sessions", "logs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4"]
ignore = [
    "E501",
    "B008",
    "B904",
    "E402",
    "F401",
    "F841",
    "C401",
    "C416",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "E402", "F401", "F841"]
"src/ovandocode/cli.py" = ["B008", "E402"]
"src/ovandocode/**/__init__.py" = ["F401"]
"src/ovandocode/tools/*.py" = ["B008"]
"src/ovandocode/providers/*.py" = ["B008"]
"src/ovandocode/mcp/*.py" = ["B008"]
"src/ovandocode/tui/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ovandocode"]
