[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovandocode"
version = "0.1.0"
description = "OVANDOCODE - Agente de codificacion autonomo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OvandoCode" }]
keywords = ["ai", "agent", "coding", "tui", "mcp", "llm"]

dependencies = [
    "textual>=0.83.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "keyring>=25.2.0",
    "python-dotenv>=1.0.1",
    "mcp>=1.0.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "aiofiles>=24.1.0",
    "tomli-w>=1.0.0",
    "platformdirs>=4.2.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
ovandocode = "ovandocode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ovandocode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line-too-long (formatter lo maneja)
    "B008",   # typer.Option() en defaults es intencional
    "B904",   # raise ... from None es intencional
    "E402",   # imports no al inicio (patron typer/CLI)
    "F401",   # re-exports intencionales en __init__.py
    "F841",   # variables de contexto sin usar
    "C401",   # comprehensions vs set() -- trivial
    "C416",   # comprehensions innecesarias -- trivial
    "UP038",  # isinstance con tuple -> union syntax -- trivial
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "E402", "F401", "F841"]
"src/ovandocode/cli.py" = ["B008", "E402"]
"src/ovandocode/**/__init__.py" = ["F401"]
"src/ovandocode/tools/*.py" = ["B008"]
"src/ovandocode/providers/*.py" = ["B008"]
"src/ovandocode/mcp/*.py" = ["B008"]
"src/ovandocode/tui/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ovandocode"]
